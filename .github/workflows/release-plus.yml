name: Release Plus

on:
  push:
    tags: ["plus-v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes unitários
        run: python3 -m unittest discover -s plus/tests
      - name: Confere que a tag bate com a versão do código
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' plus/src/apt_monitor.py)
          [ "plus-v$code" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != versão $code"; exit 1; }
      - name: Gera o .deb
        run: |
          plus/build.sh
          (cd plus/dist && sha256sum ./*.deb > SHA256SUMS)
      - name: Notas da versão
        run: |
          awk -v v="${GITHUB_REF_NAME#plus-v}" '/^## /{p=($2==v)} p' plus/CHANGELOG.md > notes.md
          {
            echo
            echo "### Instalação"
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS --ignore-missing'
            echo "sudo apt install ./$(basename plus/dist/*.deb)"
            echo '```'
            echo
            echo "Vem do APT Monitor clássico? O Plus **substitui** o clássico e **migra a sua configuração** sozinho:"
            echo "veja o [guia de migração](https://github.com/AprendendoLinux/apt-monitor-daemon/blob/main/plus/docs/migracao.md)."
          } >> notes.md
      - name: Publica (cria ou atualiza a release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" plus/dist/*.deb plus/dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" plus/dist/*.deb plus/dist/SHA256SUMS \
              --title "APT Monitor Plus ${GITHUB_REF_NAME#plus-}" --notes-file notes.md --latest
          fi
