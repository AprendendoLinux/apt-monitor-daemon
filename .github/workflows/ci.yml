name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -s sh packaging/DEBIAN/postinst packaging/DEBIAN/prerm packaging/DEBIAN/postrm
      - run: shellcheck --severity=warning -x build.sh tests/docker/*.sh
      - run: python3 -m pip install ruff && ruff check --select E9,F src tests

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:11", "debian:12", "debian:13", "ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - run: tests/docker/run-matrix.sh ${{ matrix.image }}

  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/docker/systemd-test.sh debian:12 ubuntu:24.04
