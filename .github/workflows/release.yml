name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes unitários
        run: python3 -m unittest discover -s tests
      - name: Confere que a tag bate com a versão do código
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/apt_monitor.py)
          [ "v$code" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != versão $code"; exit 1; }
      - name: Gera o .deb
        run: |
          ./build.sh
          (cd dist && sha256sum ./*.deb > SHA256SUMS)
      - name: Notas da versão
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p=($2==v)} p' CHANGELOG.md > notes.md
          {
            echo
            echo "### Instalação"
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS --ignore-missing'
            echo "sudo apt install ./$(basename dist/*.deb)"
            echo '```'
          } >> notes.md
      - name: Publica (cria ou atualiza a release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --title "APT Monitor $GITHUB_REF_NAME" --notes-file notes.md
          fi
