# Configuração do APT Monitor.
# Depois de editar:  sudo systemctl reload apt-monitor   (ou restart)
# Teste rápido:      sudo apt-monitor --test-notify
# Comentários podem começar com # ou ; (inclusive no fim da linha, precedidos de espaço).

[Telegram]
# Token do bot (ex.: 123456789:AAE...). O prefixo "bot" é opcional.
# Deixe em branco para desativar o Telegram.
BOT_TOKEN=seu_bot_token_aqui
# Chat IDs separados por vírgula
CHAT_IDS=12345678, 87654321
# Opcional: servidor da Bot API (padrão: https://api.telegram.org)
#API_BASE=https://api.telegram.org

[Monitor]
# Intervalo entre as verificações, em horas (aceita decimais, ex.: 0.5 = 30 min)
CHECK_INTERVAL_HOURS=4
# Repete o alerta a cada N dias enquanto houver pendências (0 = nunca repete)
REMINDER_DAYS=0
# Avisa quando todas as atualizações forem instaladas (true/false)
NOTIFY_ON_CLEAR=false
# Executa o equivalente a "apt update" a cada ciclo (true/false).
# Use false se você já atualiza as listas por outro meio (apt-daily.timer etc.).
UPDATE_CACHE=true
# Interfaces ignoradas na lista de IPs (curingas permitidos)
IGNORE_INTERFACES=lo,docker*,br-*,veth*,virbr*,cni*,flannel*,cali*,tun*,tap*
#LOG_FILE=/var/log/apt-monitor.log
#STATE_FILE=/var/lib/apt-monitor/state.json

[Email]
# Deixe SMTP_SERVER em branco (ou remova a seção) para desativar o e-mail.
SMTP_SERVER=smtp.seuservidor.com
SMTP_PORT=587
# auto  = porta 465 usa SSL; demais portas usam STARTTLS quando o servidor oferece
# ssl | starttls | none (none: sem criptografia, só para relays locais confiáveis)
SMTP_SECURITY=auto
# Deixe SMTP_USER vazio para servidores sem autenticação (ex.: Postfix local)
SMTP_USER=alerta@seuservidor.com
SMTP_PASS=sua_senha_segura
SENDER_NAME=APT Monitor
SENDER_EMAIL=alerta@seuservidor.com
# Destinatários separados por vírgula
RECIPIENT_EMAILS=admin@seuservidor.com, suporte@seuservidor.com
